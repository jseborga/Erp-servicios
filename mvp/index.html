const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const weekKey = d => {const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return iso(x)};

/* deterministic pseudo occupancy */
function seedOcc(spaceId, date, hour){
  let h = 0; const s = spaceId+iso(date)+hour;
  for (const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const sp = S.spaces.find(x=>x.id===spaceId);
  const r = (h % 1000)/1000;
  if (sp.cap===1) return r < 0.45 ? 1 : 0;
  const peak = (hour>=17 && hour<=19) ? 0.35 : 0;
  return Math.min(sp.cap, Math.floor(sp.cap*(r*0.75+peak)));
}
function taken(spaceId, date, hour){
  const base = seedOcc(spaceId,date,hour);
  const mine = S.bookings.filter(b=>b.space===spaceId && b.date===iso(date) && b.hour===hour).reduce((a,b)=>a+b.seats,0);
  return base + mine;
}

const $ = s => document.querySelector(s);
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ======================= Modo ======================= */
let mode='member';
function setMode(m){mode=m;$('#mode-member').setAttribute('aria-pressed',m==='member');$('#mode-admin').setAttribute('aria-pressed',m==='admin');$('#view-member').hidden=m!=='member';$('#view-admin').hidden=m!=='admin';m==='member'?renderMember():renderAdmin()}
$('#mode-member').onclick=()=>setMode('member'); $('#mode-admin').onclick=()=>setMode('admin');

/* ======================= SOCIO ======================= */
let mTab='plan';
const R = {service:'massage', day:0, hour:null, guest:false, err:null};

function renderMember(){
  const m=S.member, plan=S.plans.find(p=>p.id===m.plan);
  const stPill = m.state==='active'?'<span class="pill ok">Activa</span>':m.state==='pending'?'<span class="pill warn">Pago en validación</span>':'<span class="pill bad">Suspendida</span>';
  const v=$('#view-member'); v.innerHTML='';
  const app=el(`<div class="app">
    <div class="member-card">
      <div class="row" style="justify-content:space-between"><span class="eyebrow" style="color:inherit;opacity:.8">Membresía</span>${stPill}</div>
      <div><div class="tier">${plan.name}</div><div class="small" style="opacity:.9">${esc(m.name)} · ${m.period}</div></div>
      <div class="meta"><span>Vence <b class="mono">${m.due}</b></span><span>Socio desde <span class="mono">${m.since}</span></span></div>
    </div>
    <div class="tabs" role="tablist">
      ${[['plan','Mi plan'],['book','Reservar'],['guests','Invitados'],['pay','Pagar'],['plans','Planes']].map(([k,l])=>`<button role="tab" aria-selected="${mTab===k}" data-t="${k}">${l}</button>`).join('')}
    </div>
    <div id="mbody"></div>
  </div>`);
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{mTab=b.dataset.t;renderMember()});
  v.appendChild(app);
  const body=$('#mbody');
  ({plan:mPlan,book:mBook,guests:mGuests,pay:mPay,plans:mPlans})[mTab](body);
}

function mPlan(body){
  const m=S.member, plan=S.plans.find(p=>p.id===m.plan);
  const rows=Object.entries(m.ent).map(([k,e])=>{
    const left = e.total==null?null:e.total-e.used;
    const pct = e.total==null?100:Math.round(left/e.total*100);
    return `<div class="bal"><span class="name">${e.label}</span><span class="val">${e.total==null?'Ilimitado':`${left} de ${e.total}`}</span>
      <div class="meter"><i style="width:${pct}%"></i></div><span class="small muted" style="grid-column:1/-1">Te ${e.total==null?'queda acceso':'quedan '+left} ${e.unit} · ${e.rule}</span></div>`}).join('');
  const myB = S.bookings.slice().reverse().map(b=>`<tr><td>${esc(b.label)}</td><td class="mono">${b.dateLabel} ${pad(b.hour)}:00</td><td>${b.seats>1?'+'+(b.seats-1)+' inv.':''}</td><td><button class="btn sm ghost" data-cancel="${b.id}">Cancelar</button></td></tr>`).join('');
  body.innerHTML=`<div class="stack">
    <div class="panel"><div class="eyebrow">Tus saldos</div>${rows}
      <div class="bal"><span class="name">Invitados (free pass)</span><span class="val">${plan.guestQuota-m.guestsUsed} de ${plan.guestQuota}</span><div class="meter"><i style="width:${(plan.guestQuota-m.guestsUsed)/plan.guestQuota*100}%"></i></div></div>
    </div>
    <div class="panel"><div class="eyebrow">Próximas reservas</div>
      ${S.bookings.length?`<div class="tbl-wrap"><table><tbody>${myB}</tbody></table></div><p class="note" style="margin:10px 0 0">Cancelación gratis hasta 12 h antes. Después, pierdes la sesión (política del plan Premium).</p>`:'<p class="muted small" style="margin:8px 0 0">Aún no tienes reservas. Ve a <b>Reservar</b>.</p>'}
    </div>
    <div class="panel row" style="justify-content:space-between"><div><div class="eyebrow">Credencial de acceso</div><div class="small muted">Muestra este QR en recepción para el check-in.</div></div><canvas class="qr" id="cardqr" width="160" height="160" style="width:90px;height:90px;margin:0;padding:5px" aria-label="QR ilustrativo de la credencial"></canvas></div>
  </div>`;
  drawQR($('#cardqr'),'socio-ana');
  body.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{
    const bk=S.bookings.find(x=>x.id==b.dataset.cancel);
    S.bookings=S.bookings.filter(x=>x!==bk);
    const e=S.member.ent[bk.service]; if(e && e.total!=null) e.used=Math.max(0,e.used-1); else if(e) e.used--;
    toast('Reserva cancelada · saldo devuelto'); renderMember();
  });
}

function mBook(body){
  const svc=S.services.find(s=>s.id===R.service), sp=S.spaces.find(x=>x.id===svc.space);
  const days=[...Array(7)].map((_,i)=>addDays(TODAY,i));
  const d=days[R.day];
  const hours=[]; for(let h=sp.open;h<sp.close;h+=sp.slot) hours.push(h);
  const ent=S.member.ent[svc.id];
  // rules
  let rule=null;
  if(ent && ent.total!=null && ent.total-ent.used<=0) rule={t:'bad',m:`No te quedan sesiones de ${ent.label.toLowerCase()} este mes. Puedes comprar una sesión suelta (${BS(svc.price)}).`};
  if(svc.id==='massage'){
    const wk=weekKey(d); const already=S.bookings.some(b=>b.service==='massage'&&weekKey(new Date(b.date+'T00:00'))===wk) || (wk===weekKey(TODAY) && S.member.ent.massage.used>=1 && !S.bookings.some(b=>b.service==='massage'));
    if(already) rule={t:'warn',m:'Tu plan permite 1 masaje por semana y ya usaste el de esta semana. Elige un día de la próxima semana.'};
  }
  if(sp.mode==='free') rule={t:'info',m:`${sp.name} funciona con acceso libre: no necesitas reserva, solo haz check-in con tu QR. Aforo máximo ${sp.cap} personas; ahora hay ${taken(sp.id,TODAY,Math.max(sp.open,Math.min(new Date().getHours(),sp.close-1)))}.`};
  const slots=hours.map(h=>{
    const t=taken(sp.id,d,h), free=sp.cap-t, past = R.day===0 && h<=new Date().getHours();
    const need = 1+(R.guest&&svc.guests?1:0);
    const dis = past || free<need || (rule&&rule.t!=='info') || sp.mode==='free';
    return `<button class="slot" data-h="${h}" aria-pressed="${R.hour===h}" ${dis?'disabled':''}><span class="t">${pad(h)}:00–${pad(h+sp.slot)}:00</span><div class="capbar"><i class="${free<=0?'full':''}" style="width:${t/sp.cap*100}%"></i></div><span class="cap">${past?'Pasó':free<=0?'Lleno':`${free} de ${sp.cap} libres`}</span></button>`}).join('');
  body.innerHTML=`<div class="stack">
    <div class="field"><label for="svc">Servicio</label><select id="svc">${S.services.map(s=>`<option value="${s.id}" ${s.id===R.service?'selected':''}>${s.name}</option>`).join('')}</select></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Día</div><div class="chips">${days.map((x,i)=>`<button class="chip" data-d="${i}" aria-pressed="${i===R.day}">${DOW[x.getDay()]}<b>${x.getDate()}</b></button>`).join('')}</div></div>
    ${rule?`<div class="msg ${rule.t==='info'?'ok':rule.t}">${rule.m}</div>`:''}
    ${svc.guests?`<label class="row small"><input type="checkbox" id="g" ${R.guest?'checked':''}> Llevo un invitado (ocupa 1 cupo más)</label>`:''}
    <div><div class="eyebrow" style="margin-bottom:6px">Horarios · ${sp.name}${sp.staff?' · '+sp.staffName:''}</div><div class="slots">${slots}</div></div>
    ${R.err?`<div class="msg bad">${R.err}</div>`:''}
    <button class="btn primary" id="confirm" ${R.hour==null?'disabled':''}>Confirmar reserva</button>
  </div>`;
  $('#svc').onchange=e=>{R.service=e.target.value;R.hour=null;R.err=null;R.guest=false;renderMember()};
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{R.day=+b.dataset.d;R.hour=null;R.err=null;renderMember()});
  body.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{R.hour=+b.dataset.h;R.err=null;renderMember()});
  const g=$('#g'); if(g) g.onchange=()=>{R.guest=g.checked;R.hour=null;renderMember()};
  $('#confirm').onclick=()=>{
    const seats=1+(R.guest&&svc.guests?1:0);
    if(sp.cap-taken(sp.id,d,R.hour)<seats){R.err='Ese horario se llenó mientras elegías. Elige otro.';return renderMember()}
    S.bookings.push({id:Date.now(),service:svc.id,space:sp.id,label:svc.name,date:iso(d),dateLabel:`${DOW[d.getDay()]} ${d.getDate()}`,hour:R.hour,seats,who:S.member.name});
    if(ent) ent.used++;
    let extra='';
    if(seats>1){ addGuest('Invitado de Ana','', svc.name); extra=' · invitado registrado'; }
    R.hour=null; R.guest=false; mTab='plan'; toast('Reserva confirmada'+extra); renderMember();
  };
}

function addGuest(name,phone,where){
  const plan=S.plans.find(p=>p.id===S.member.plan);
  const free = S.member.guestsUsed < plan.guestQuota;
  if(free) S.member.guestsUsed++;
  S.guests.push({name,phone,where,charge:free?'Free pass':BS(S.member.guestFee)});
  S.leads.push({id:Date.now(),name,src:'Invitado de socio',stage:1,note:`Invitado de ${S.member.name} · ${where}`});
  return free;
}

function drawQR(cv,seed){
  if(!cv) return; const ctx=cv.getContext('2d'); const n=25, s=cv.width/n;
  let h=7; for(const c of seed) h=(h*131+c.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#10262B';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ if(rnd()>.52) ctx.fillRect(x*s,y*s,s,s); }
  const finder=(x,y)=>{ctx.fillStyle='#10262B';ctx.fillRect(x*s,y*s,7*s,7*s);ctx.fillStyle='#fff';ctx.fillRect((x+1)*s,(y+1)*s,5*s,5*s);ctx.fillStyle='#10262B';ctx.fillRect((x+2)*s,(y+2)*s,3*s,3*s)};
  finder(0,0);finder(n-7,0);finder(0,n-7);
}

const live={pool:9,sauna:3,jacuzzi:4,massage:1};

  const act=S.members.filter(m=>m.state==='active').length, mora=S.members.filter(m=>m.state!=='active').length;

      <div class="kpi"><div class="v">${mora}</div><div class="l">En gracia o suspendidos</div></div>
      <div class="kpi"><div class="v">${S.payments.length}</div><div class="l">Pagos por validar</div></div>

let agDay=0;
function aAgenda(b){
  const d=addDays(TODAY,agDay); const hrs=[]; for(let h=8;h<20;h++) hrs.push(h);
  const cols=S.spaces;
  let grid=`<div class="agenda" style="grid-template-columns:64px repeat(${cols.length},minmax(0,1fr))"><div></div>${cols.map(c=>`<div class="h">${c.name} · ${c.cap}</div>`).join('')}`;
  hrs.forEach(h=>{grid+=`<div class="tm">${pad(h)}:00</div>`;cols.forEach(sp=>{
    const inSlot = h>=sp.open && h<sp.close && ((h-sp.open)%sp.slot===0);
    const within = h>=sp.open && h<sp.close;
    if(!within){grid+='<div class="c na"></div>';return}
    if(sp.mode==='free'){grid+=`<div class="c"><span class="small muted">Libre · aforo ${sp.cap}</span></div>`;return}
    if(!inSlot){grid+='<div class="c na" aria-hidden="true"></div>';return}
    const t=taken(sp.id,d,h), mine=S.bookings.filter(x=>x.space===sp.id&&x.date===iso(d)&&x.hour===h);
    grid+=`<div class="c"><div class="row" style="justify-content:space-between"><span class="mono">${t}/${sp.cap}</span>${t>=sp.cap?'<span class="pill bad">Lleno</span>':''}</div><div class="capbar"><i class="${t>=sp.cap?'full':''}" style="width:${t/sp.cap*100}%"></i></div>${mine.map(m=>`<span class="pill info">${esc(m.who.split(' ')[0])}${m.seats>1?' +1':''}</span>`).join('')}</div>`;
  })});
  grid+='</div>';
  b.innerHTML=head('Agenda por espacio','Ocupación por franja')+`<div class="stack"><div class="chips">${[...Array(7)].map((_,i)=>{const x=addDays(TODAY,i);return `<button class="chip" data-ad="${i}" aria-pressed="${i===agDay}">${DOW[x.getDay()]}<b>${x.getDate()}</b></button>`}).join('')}</div>
  <div class="panel tbl-wrap">${grid}</div><p class="note">Las reservas hechas desde la vista Socio aparecen aquí con el nombre del socio.</p></div>`;
  b.querySelectorAll('[data-ad]').forEach(x=>x.onclick=()=>{agDay=+x.dataset.ad;renderAdmin()});
}

function aPayments(b){
  b.innerHTML=head('Pagos por validar','Caja · QR y transferencias')+`<div class="panel">${S.payments.length?`<div class="tbl-wrap"><table><thead><tr><th>Socio</th><th>Concepto</th><th>Medio</th><th>Recibido</th><th class="num">Monto</th><th></th></tr></thead><tbody>${S.payments.map(p=>`<tr><td>${esc(p.who)}</td><td>${p.concept}</td><td><span class="pill neutral">${p.method}</span></td><td class="small muted">${p.when}</td><td class="num">${BS(p.amount)}</td><td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm primary" data-ok="${p.id}">Validar</button><button class="btn sm ghost" data-no="${p.id}">Rechazar</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No hay pagos pendientes.</p>'}

  b.innerHTML=head('CRM','Captación y retención')+`<div class="stack">
  <div class="kanban">${S.stages.map((st,i)=>{const ls=S.leads.filter(l=>l.stage===i);return `<div class="col"><h4><span>${st}</span><span class="mono">${ls.length}</span></h4>${ls.map(l=>`<div class="lead"><span class="n">${esc(l.name)}</span><span class="pill ${l.src.includes('Invitado')||l.src==='Cortesía'?'info':'neutral'}" style="align-self:flex-start">${esc(l.src)}</span><span class="small muted">${esc(l.note)}</span><div class="acts">${i>0?`<button data-mv="${l.id}" data-d="-1" aria-label="Mover atrás">←</button>`:''}${i<5?`<button data-mv="${l.id}" data-d="1" aria-label="Mover adelante">→</button>`:''}</div></div>`).join('')}</div>`}).join('')}</div>

  $('#pt').onchange=e=>{sync();PF.type=e.target.value;PF.err=PF.ok=null;renderAdmin()};
  $('#pf').onsubmit=e=>{e.preventDefault();sync();PF.err=PF.ok=null;

  const calc=()=>{PF.kind=$('#rk').value;PF.mode=$('#rm').value;PF.base=parseFloat($('#rb').value)||0;
    const iue=PF.kind==='services'?.125:.05, it=.03, tot=iue+it; let rows,gross;
    if(PF.mode==='supplier'){const r1=PF.base*iue,r2=PF.base*it;rows=[['Gasto',PF.base,0],['Caja / Fondo fijo',0,PF.base-r1-r2],['2138 Retenciones IUE por pagar',0,r1],['2137 Retenciones IT por pagar',0,r2]];}
    else{gross=PF.base/(1-tot);const r1=gross*iue,r2=gross*it;rows=[['Gasto',PF.base,0],['Retención IUE asumida (no deducible*)',r1,0],['Retención IT asumida (no deducible*)',r2,0],['Caja / Fondo fijo',0,PF.base],['2138 Retenciones IUE por pagar',0,r1],['2137 Retenciones IT por pagar',0,r2]];}
    $('#ent').innerHTML=`<div class="tbl-wrap"><table class="entry"><thead><tr><th>Cuenta</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="font-family:var(--f-body)">${r[0]}</td><td class="num">${r[1]?r[1].toFixed(2):''}</td><td class="num">${r[2]?r[2].toFixed(2):''}</td></tr>`).join('')}</tbody></table></div>${PF.mode==='company'?`<p class="small muted" style="margin:6px 0 0">Base grossing-up ${gross.toFixed(2)}. *Deducibilidad a confirmar con el contador.</p>`:''}`};
  ['rk','rm','rb'].forEach(id=>$('#'+id).addEventListener('input',()=>{const prev=PF.mode;calc();if(id==='rm'&&prev!==PF.mode)renderAdmin()}));
  calc();
}

function aFund(b){
  const F=S.fund; const spent=F.vouchers.reduce((a,v)=>a+v.amount,0);
  const ret=v=>v.doc==='none'&&v.mode==='supplier'?v.amount*(v.kind==='services'?.155:.08):0;
  const totRet=F.vouchers.reduce((a,v)=>a+ret(v),0);
  const iva=F.vouchers.filter(v=>v.doc==='invoice').reduce((a,v)=>a+v.amount*.13,0);
  const cashOut=spent-totRet; const expected=F.amount-cashOut; const diff=F.cash-expected;
  b.innerHTML=head(F.name,'Fondo fijo · custodio '+F.custodian)+`<div class="stack">
  <div class="kpis"><div class="kpi"><div class="v">${BS(F.amount)}</div><div class="l">Monto fijo (cuenta 11121)</div></div><div class="kpi"><div class="v">${BS(cashOut)}</div><div class="l">Pagado en efectivo</div></div><div class="kpi"><div class="v">${BS(F.cash)}</div><div class="l">Efectivo contado (arqueo)</div></div><div class="kpi"><div class="v" style="color:${Math.abs(diff)<.01?'var(--ok)':'var(--bad)'}">${diff>=0?'+':''}${diff.toFixed(2)}</div><div class="l">Diferencia de arqueo</div></div></div>
  <div class="panel tbl-wrap"><table><thead><tr><th>Gasto</th><th>Documento</th><th class="num">Monto</th><th class="num">Retención</th></tr></thead><tbody>${F.vouchers.map(v=>`<tr><td>${v.desc}</td><td>${v.doc==='invoice'?'<span class="pill ok">Con factura</span>':'<span class="pill warn">Sin factura · '+(v.kind==='services'?'servicio 15,5 %':'bien 8 %')+'</span>'}</td><td class="num">${BS(v.amount)}</td><td class="num">${ret(v)?BS(ret(v)):'—'}</td></tr>`).join('')}</tbody></table></div>
  <div class="panel stack"><h3>Asiento de reposición (al validar la rendición)</h3><div class="tbl-wrap"><table class="entry"><thead><tr><th>Cuenta</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>
   <tr><td style="font-family:var(--f-body)">Gastos (neto de IVA)</td><td class="num">${(spent-iva).toFixed(2)}</td><td></td></tr>
   <tr><td style="font-family:var(--f-body)">1141 Crédito Fiscal IVA</td><td class="num">${iva.toFixed(2)}</td><td></td></tr>
   <tr><td style="font-family:var(--f-body)">2137/2138 Retenciones por pagar</td><td></td><td class="num">${totRet.toFixed(2)}</td></tr>
   <tr><td style="font-family:var(--f-body)">Banco (reposición)</td><td></td><td class="num">${cashOut.toFixed(2)}</td></tr></tbody></table></div>
   <p class="small muted" style="margin:0">La cuenta del fondo no se mueve: sigue en ${BS(F.amount)}. Después de reponer, el custodio vuelve a tener ${BS(F.amount)} en efectivo.</p>
   <div class="row">${F.reimbursed?'<span class="pill ok">Repuesto</span>':`<button class="btn primary" id="reimb">Validar y reponer</button>`}</div></div></div>`;
  const r=$('#reimb'); if(r) r.onclick=()=>{F.reimbursed=true;toast('Rendición validada · reposición registrada');renderAdmin()};
}
